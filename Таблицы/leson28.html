<!DOCTYPE html>
<html lang="ru">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблица</title>
</head>
<body>
    <table>
        <caption>Название таблицы</caption>
        <thead>
            <tr>
                <th rowspan="2">Текст</th>
                <th colspan="2">Числа</th>
            </tr>
            <tr>
                <th>Грн</th>
                <th>$</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>хз</td>
                <td>10000</td>
                <td>200</td>
            </tr>
            <tr>
                <td>Что-то</td>
                <td>1000</td>
                <td>20</td>
            </tr>
        </tbody>
        <tfoot>
            <td>Итого</td>
            <td>11000</td>
            <td>220</td>
        </tfoot>
    </table>
</body>

<!---
colspan	Горизонтально Объединяет столбцы
rowspan	Вертикально	Объединяет строки --->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="#">
        <input type="hidden" name="hade" />
        <div>
            <label for="email">Введите Email</label> 
            <input type="email" placeholder="Email пользователя" id="email" name="email" required/>
        </div>
        <div>
            <label for="password">Введите пароль</label>
            <input type="password" placeholder="Пароль пользователя" id="password" name="password" required/>
        </div>
        <div>
            <label for="BirtyDate">Введите дату рождения</label>
            <input type="date" placeholder="Дата рождения пользователя" id="BirtyDate" name="BirtyDate" required/>
        </div>
        <div>
            <label>
                Введи число
                <input type="number" placeholder="Введи число"/>
            </label>
        </div>
        <button type="submit">Кнопка 1</button>
        <!--
        <button type="button">Кнопка 2</button>
        <input type="button" value="Кнопка 3" />
        <input type="submit" value="Кнопка 4" />
        -->
        <div>
            <label id="agree">Согласен</label>
            <input type="checkbox" name="agree" id="agree" />
        </div>
        <div>
            <label id="all">Поиск везде</label> 
            <input type="radio" name="search" id="all" value="all" />
        </div>
        <div>
            <label id="viki">Поиск в вики</label>
            <input type="radio" name="search" id="viki" value="viki" />
        </div>
        <div>
            <label for="topic">Тематика</label>
            <select name="topic", id="topic">
                <option value="1">Вариант 1</option>
                <optgroup label="popular">
                    <option value="2">Вариант 2</option>
                    <option value="3">Вариант 3</option>
                </optgroup>
            </select>
        </div>
        <div>
            <label for="volume">Громкость видео</label>
            <input type="range" name="volume" id="volume" min="0" max="10" step="1" />
        </div>
        <div>
            <label for="num">Оценка</label>
            <input type="number" name="num" id="num" min="0" max="10" step="1" />
        </div>
        <div>
            <label for="text">Коментарий</label>
            <textarea name="text" id="text" rows="10" cols="20"></textarea>
        </div>
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="#">
        <h1>Свяжитксь со мной</h1>
        <div>
            <label for="email">Enter email</label> 
            <input type="email" placeholder="Email пользователя" id="email" name="email" required/>
        </div>
        <div>
            <label for="telegram">Enter telegram</label> 
            <input type="email" placeholder="Telegram пользователя" id="telegram" name="telegram" required/>
        </div>
        <div>
            <label for="topic">Тематика</label>
            <select name="topic", id="topic">
                <option value="1">Вариант 1</option>
                <option value="2">Вариант 2</option>
                <option value="3">Вариант 3</option>
            </select>
        </div>
        <div>
            <label for="text">Коментарий</label>
            <textarea name="text" id="text" rows="10" cols="20"></textarea>
        </div>
        <button type="submit">Отправить</button>
    </form>
</body>
</html>
